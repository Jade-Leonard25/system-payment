<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Key Products · Test Dashboard</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f3f6fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * { box-sizing: border-box; }

      body { margin: 0; }

      main {
        width: min(1120px, calc(100% - 32px));
        margin: 48px auto;
      }

      header, .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      h1 { margin: 0; font-size: clamp(1.6rem, 3vw, 2.2rem); }
      .subtitle, .muted { color: #667085; }
      .subtitle { margin: 8px 0 0; }
      .toolbar { margin: 28px 0 14px; }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        color: white;
        background: #315ee7;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled { cursor: wait; opacity: .65; }

      .panel {
        overflow: hidden;
        border: 1px solid #e1e7f0;
        border-radius: 12px;
        background: white;
        box-shadow: 0 8px 24px #1720330a;
      }

      .message { padding: 20px; color: #667085; }
      .message.error { color: #b42318; }
      .table-wrap { overflow-x: auto; }

      table { width: 100%; border-collapse: collapse; text-align: left; }
      th, td { padding: 13px 16px; border-bottom: 1px solid #edf0f5; white-space: nowrap; }
      th { color: #667085; background: #fafbfc; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
      tbody tr:last-child td { border-bottom: 0; }
      code { font-size: .9rem; }

      .status {
        display: inline-block;
        border-radius: 999px;
        padding: 4px 9px;
        background: #e8f7ef;
        color: #18794e;
        font-size: .8rem;
        font-weight: 650;
        text-transform: capitalize;
      }

      .status.revoked { background: #fff0ed; color: #b42318; }
      .notice { margin-top: 12px; font-size: .88rem; }

      @media (max-width: 600px) {
        main { margin-top: 28px; }
        header { align-items: flex-start; flex-direction: column; }
        .toolbar { align-items: flex-start; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Key Products</h1>
          <p class="subtitle">Testing view of key records stored in the database.</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </header>

      <section class="toolbar" aria-live="polite">
        <strong id="summary">Loading keys…</strong>
        <span class="muted">Key values and bcrypt hashes are never shown.</span>
      </section>

      <section class="panel">
        <div id="message" class="message">Loading key products…</div>
        <div id="table-wrap" class="table-wrap" hidden>
          <table>
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Selector</th>
                <th scope="col">Status</th>
                <th scope="col">Created</th>
              </tr>
            </thead>
            <tbody id="records"></tbody>
          </table>
        </div>
      </section>

      <p class="notice muted">Sign in as an administrator in this browser to access the records.</p>
    </main>

    <script>
      const message = document.querySelector("#message");
      const tableWrap = document.querySelector("#table-wrap");
      const recordsElement = document.querySelector("#records");
      const summary = document.querySelector("#summary");
      const refreshButton = document.querySelector("#refresh");

      function cell(text, tagName = "td") {
        const element = document.createElement(tagName);
        element.textContent = text;
        return element;
      }

      async function loadKeys() {
        refreshButton.disabled = true;
        message.hidden = false;
        message.className = "message";
        message.textContent = "Loading key products…";
        tableWrap.hidden = true;
        summary.textContent = "Loading keys…";

        try {
          const response = await fetch("/api/key-products?limit=1000", {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
          });
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) {
              throw new Error("Sign in as an administrator, then refresh this page.");
            }
            const result = await response.json().catch(() => null);
            throw new Error(result?.error || `Request failed (${response.status})`);
          }

          const result = await response.json();
          recordsElement.replaceChildren();

          for (const record of result.data) {
            const row = document.createElement("tr");
            row.append(
              cell(record.id),
              cell(record.keySelector, "td"),
            );
            const statusCell = document.createElement("td");
            const badge = document.createElement("span");
            badge.className = `status${record.status === "revoked" ? " revoked" : ""}`;
            badge.textContent = record.status;
            statusCell.append(badge);
            row.append(statusCell, cell(new Date(record.createdAt).toLocaleString()));
            recordsElement.append(row);
          }

          summary.textContent = `${result.count} key product${result.count === 1 ? "" : "s"}`;
          message.hidden = result.data.length > 0;
          message.textContent = result.data.length ? "" : "No key products found.";
          tableWrap.hidden = result.data.length === 0;
        } catch (error) {
          message.className = "message error";
          message.textContent = error instanceof Error ? error.message : "Unable to load key products.";
          summary.textContent = "Could not load keys";
        } finally {
          refreshButton.disabled = false;
        }
      }

      refreshButton.addEventListener("click", loadKeys);
      loadKeys();
    </script>
  </body>
</html>
